name: APK Olustur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Zip dosyasini ac
        run: if [ ! -f package.json ]; then mkdir -p _p && unzip -q -o "$(ls -t ./*.zip | head -n1)" -d _p; fi
      - name: APK derle
        run: bash "$(find . -name ci-build-apk.sh -not -path '*/node_modules/*' | head -n1)"
      - uses: actions/upload-artifact@v4
        with:
          name: deutsch-meister-apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Deutsch Meister APK ${{ github.run_number }}
          files: out/*.apk
          prerelease: true
